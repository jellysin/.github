<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="JellySin — independent plugins for Jellyfin 12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- media pulse and plugin stream paths -->
  <g fill="none" stroke-linecap="round">
    <path d="M760 74 C 830 44, 900 90, 980 60 S 1080 84, 1160 54"
          stroke="url(#wave)" stroke-width="14"/>
    <path d="M760 74 C 830 44, 900 90, 980 60 S 1080 84, 1160 54"
          stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <path d="M760 80 C 830 50, 900 96, 980 66 S 1080 90, 1160 60"
          stroke="#06b6d4" stroke-width="1.6" stroke-dasharray="7 9" opacity="0.6"/>
    <circle cx="760" cy="74" r="4" fill="#06b6d4"/>
    <circle cx="980" cy="60" r="4" fill="#3b82f6"/>
    <circle cx="1160" cy="54" r="4" fill="#8b5cf6"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">Jelly<tspan fill="url(#accent)">Sin</tspan></text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="340" y="52">Independent plugins for Jellyfin 12</text>
    <text x="340" y="76">Shared release tooling · Plugin Repository</text>
  </g>
</svg>
